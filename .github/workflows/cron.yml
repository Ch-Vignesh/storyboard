# Scheduled work (FR-12.3, FR-12.4; decisions 0012 and 0030).
#
# Vercel's Hobby plan refuses any cron that runs more than once a day, and this
# product has a job every ten minutes. So the clock lives here and calls the
# same authenticated endpoint Vercel Cron would have: POST /api/cron/<job>.
#
# Needs, under Settings → Secrets and variables → Actions:
#   secret    CRON_SECRET  the same value as CRON_SECRET on the app's Vercel project
#   variable  APP_URL      the app's public URL, e.g. https://draftboard-cyan.vercel.app
# Without APP_URL every run is skipped, so a fork or an undeployed copy does nothing.
#
# GitHub starts scheduled runs late when it is busy — minutes, sometimes more —
# and stops scheduling them in a public repository after 60 days without
# activity. keepalive.yml enables them again twice a month, and fails while
# there is still time to push once nothing has been committed for 40 days
# (phase 14, item 10.3). Any job can be run by hand from the Actions tab:
# Scheduled jobs → Run workflow.
name: Scheduled jobs

on:
  schedule:
    - cron: '*/10 * * * *' # immediate
    - cron: '0 * * * *' # hourly
    - cron: '0 9 * * 0' # weekly
    - cron: '30 8 * * *' # nudge
    - cron: '15 3 * * *' # prune
    - cron: '45 3 * * *' # purge
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options: [immediate, hourly, weekly, nudge, prune, purge]

permissions: {}

# One run of a job at a time; a slow one is waited for, never cancelled halfway.
# Grouped by job name, from the schedule or the choice, so a run by hand waits
# for the scheduled one. Grouped by the schedule string, as it was until the
# phase 12 audit, the two were different groups and could send the same mail
# at once.
concurrency:
  group: cron-${{ github.event.schedule == '*/10 * * * *' && 'immediate' || github.event.schedule == '0 * * * *' && 'hourly' || github.event.schedule == '0 9 * * 0' && 'weekly' || github.event.schedule == '30 8 * * *' && 'nudge' || github.event.schedule == '15 3 * * *' && 'prune' || github.event.schedule == '45 3 * * *' && 'purge' || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the job
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.job }}
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # No retry. A run that fails is picked up by the next one (decision
        # 0012), and retrying one that failed partway could send mail twice.
        run: |
          case "$SCHEDULE" in
            '*/10 * * * *') job=immediate ;;
            '0 * * * *') job=hourly ;;
            '0 9 * * 0') job=weekly ;;
            '30 8 * * *') job=nudge ;;
            '15 3 * * *') job=prune ;;
            '45 3 * * *') job=purge ;;
            '') job="$CHOSEN" ;;
            *) echo "No job for schedule '$SCHEDULE'"; exit 1 ;;
          esac
          if [ -z "$CRON_SECRET" ]; then
            echo "The CRON_SECRET repository secret is not set."
            exit 1
          fi
          echo "Running $job against $APP_URL"
          # The status only. The body says how many accounts were erased and
          # how many people were emailed, and this repository's Actions logs
          # are public (the backup drill runs --quiet for the same reason). The
          # deployment logs the full result where only its owner can read it.
          body="$RUNNER_TEMP/cron-body"
          status=$(curl --silent --show-error --max-time 300 -o "$body" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/$job") || { echo "Could not reach $APP_URL"; exit 1; }
          if [ "$status" -ge 300 ]; then
            echo "$job failed: HTTP $status $(head -c 100 "$body")"
            exit 1
          fi
          echo "$job finished: HTTP $status"
