name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storyboard
          POSTGRES_PASSWORD: storyboard
          POSTGRES_DB: storyboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storyboard -d storyboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: 'true'
      DATABASE_URL: postgresql://storyboard:storyboard@localhost:5432/storyboard
      AUTH_SECRET: ci-only-secret-value-never-used-in-production-0123456789
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
      EMAIL_FROM: Storyboard <ci@example.com>
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Vocabulary
        run: pnpm check-vocabulary

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
