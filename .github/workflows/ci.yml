name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: storyboard
          POSTGRES_PASSWORD: storyboard
          POSTGRES_DB: storyboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storyboard -d storyboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: 'true'
      DATABASE_URL: postgresql://storyboard:storyboard@localhost:5432/storyboard
      AUTH_SECRET: ci-only-secret-value-never-used-in-production-0123456789
      AUTH_URL: http://localhost:3200
      AUTH_TRUST_HOST: 'true'
      EMAIL_FROM: Storyboard <ci@example.com>
      NEXT_PUBLIC_APP_URL: http://localhost:3200
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3201
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Vocabulary
        run: pnpm check-vocabulary

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Seed
        run: pnpm db:seed

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The critical flows (architecture section 8). They run against the built
      # application and the Postgres service above, so they are the only check
      # here that exercises sign-up, the editor and the 404-on-private rule end
      # to end. `pnpm e2e` builds and starts the server itself.
      - name: Install Playwright browser
        run: pnpm --filter @storyboard/app exec playwright install --with-deps chromium

      - name: End-to-end flows
        run: pnpm e2e
        env:
          E2E_PORT: '3100'
          AUTH_URL: http://localhost:3100
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          # The console mailer appends here so the sign-up flow can read its
          # own verification link (decision 0002).
          MAIL_LOG_FILE: ${{ runner.temp }}/mail.log

      - name: Upload the flow report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/app/playwright-report
          retention-days: 7
